[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-gateway"
version = "0.1.0"
description = "Tenant-isolated, citation-validated retrieval with deterministic release evaluations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ManeeGit"}]
dependencies = []

[project.scripts]
evidence-gateway = "evidence_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
